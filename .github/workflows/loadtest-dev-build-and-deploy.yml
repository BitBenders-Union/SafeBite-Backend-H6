name: Test, Build and Deploy Dev LoadTest Backend To VPS

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0"

      - name: Restore Dependencies
        run: dotnet restore SafeBite-Backend-H6.slnx

      - name: Build Solution
        run: dotnet build SafeBite-Backend-H6.slnx --configuration Release --no-restore

      - name: Run XUnit tests with reports
        working-directory: ./SafeBite-Backend-H6.Test
        run: |
          dotnet test SafeBite-Backend-H6.Test.csproj \
          --configuration Release \
          --no-build \
          --logger "trx;LogFileName=TestResults.trx" \
          --results-directory "TestResults"

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test Results
          path: SafeBite-Backend-H6.Test/TestResults/*.trx
          if-no-files-found: warn

      - name: Publish Test Results Summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: SafeBite API XUnit Tests Results
          path: SafeBite-Backend-H6.Test/TestResults/*.trx
          reporter: dotnet-trx
          fail-on-empty: false

  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build Docker image
        working-directory: .
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          version="dev-${{ github.event.release.tag_name || github.run_number }}"

          echo "Building version: ${version}"

          docker build \
            -f SafeBite-Backend-H6.API/Dockerfile.loadtest \
            -t ghcr.io/${owner}/dev-safebite-api-loadtest:${version} \
            -t ghcr.io/${owner}/dev-safebite-api-loadtest:latest \
            .

      - name: Push Docker image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          version="dev-${{ github.event.release.tag_name || github.run_number }}"

          docker push ghcr.io/${owner}/dev-safebite-api-loadtest:${version}
          docker push ghcr.io/${owner}/dev-safebite-api-loadtest:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: VPS_DEV

    steps:
      - name: Deploy container to VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: chimpchonkserver.duckdns.org
          username: githubaction
          key: ${{ secrets.SSH_KEY }}
          script: |
            owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            version="dev-${{ github.event.release.tag_name || github.run_number }}"

            container_name="dev-safebite-api-loadtest"

            echo "Logging in to Docker registry..."
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GHCR_PAT }}

            echo "Pulling image..."
            docker pull ghcr.io/${owner}/dev-safebite-api-loadtest:${version}

            echo "Removing existing container..."
            docker ps -a --filter "name=${container_name}" --format "{{.ID}}" | xargs -r docker rm -f

            echo "Starting new container..."

            docker run -d \
              -p 9091:80 \
              -p 9444:443 \
              --network safebite-network \
              -v /etc/letsencrypt/live/chimpchonkserver.duckdns.org:/https:ro \
              -e ConnectionStrings__AppConnection='${{ secrets.LOADTEST_APP_DB }}' \
              -e ConnectionStrings__AuthConnection='${{ secrets.LOADTEST_AUTH_DB }}' \
              -e ASPNETCORE_URLS='https://+;http://+' \
              -e ASPNETCORE_HTTPS_PORT=443 \
              -e ASPNETCORE_ENVIRONMENT=Development \
              -e ASPNETCORE_Kestrel__Certificates__Default__Path=/https/safebite.pfx \
              -e ASPNETCORE_Kestrel__Certificates__Default__Password='${{ secrets.SSL_PASS }}' \
              -e Testing__UseFakeOcr=true \
              -e Testing__UseFakeScanAnalysis=true \
              -e RateLimiting__Global__AdminPermitLimit=10000 \
              -e RateLimiting__Global__UserPermitLimit=5000 \
              -e RateLimiting__Scan__PermitLimit=500 \
              -e OpenAI__ApiKey='${{ secrets.OPENAI_KEY }}' \
              -e Email__From='${{ secrets.EMAIL_FROM }}' \
              -e Email__Username='${{ secrets.EMAIL_USER }}' \
              -e Email__Password='${{ secrets.EMAIL_PASS }}' \
              -e Email__Host='${{ secrets.EMAIL_HOST }}' \
              -e Email__Port='587' \
              -e Email__EnableSsl='true' \
              -e Seed__AdminEmail='${{ secrets.ADMIN_EMAIL }}' \
              -e Seed__AdminPassword='${{ secrets.ADMIN_PASS }}' \
              -e User__UserId='${{ secrets.USER_ID }}' \
              -e Allergy__PeanutAllergyId='${{ secrets.PNUT_ALGY_ID }}' \
              --name "${container_name}" \
              ghcr.io/${owner}/dev-safebite-api-loadtest:${version}

            echo "Deployment completed."
