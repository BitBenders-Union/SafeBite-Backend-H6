services:
  postgres:
    image: postgres:16
    container_name: safebiteH6-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: safebiteH6_app
    ports:
      - "55432:5432"
    volumes:
      - safebiteH6_postgres_data:/var/lib/postgresql/data

volumes:
  safebiteH6_postgres_data: